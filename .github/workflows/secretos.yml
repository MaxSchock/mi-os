name: secretos

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
      GITLEAKS_CONFIG_SHA256: "e163e53b9e7e8a8511e77271e2b323ed057759542a6d988258afe3a1fa329caf"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Instalar gitleaks (versión fija, checksum comprobado)
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Reglas por defecto sin la lista global de rutas excluidas (svg, pdf, imágenes también se miran)
        run: |
          curl -sSfL -o default.toml "https://raw.githubusercontent.com/gitleaks/gitleaks/v${GITLEAKS_VERSION}/config/gitleaks.toml"
          echo "${GITLEAKS_CONFIG_SHA256}  default.toml" | sha256sum -c -
          python3 - <<'PY'
          import re
          t = open("default.toml", encoding="utf-8").read()
          i, f = t.index("[allowlist]"), t.index("[[rules]]")
          s, n = re.subn(r"paths = \[.*?\n\]\n", "", t[i:f], count=1, flags=re.S)
          assert n == 1 and "paths" not in s, "global path allowlist not removed"
          open("ci.toml", "w", encoding="utf-8").write(t[:i] + s + t[f:])
          PY
      - name: Sin ficheros que eximan secretos
        # gitleaks 8.30.1 reads the .gitleaksignore of the scanned folder even with --gitleaks-ignore-path.
        run: |
          if git log --all --format= --name-only | grep -E '(^|/)\.gitleaks(ignore|\.toml)$'; then
            echo "::error::.gitleaksignore o .gitleaks.toml en el historial"
            exit 1
          fi
      - name: Buscar secretos en todo el historial
        # Empty ignore file outside the checkout: a .gitleaksignore in the repo cannot exempt findings.
        run: |
          : > "$RUNNER_TEMP/gitleaksignore-vacio"
          ./gitleaks git --config ci.toml --gitleaks-ignore-path "$RUNNER_TEMP/gitleaksignore-vacio" --redact --no-banner --exit-code 1 .
